# The rules of the spec tree a machine can hold: the OpenSpec validator over
# every spec and change, and scripts/check-docs.py over what it leaves alone.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: ["**"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  openspec:
    name: OpenSpec validation
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24

      # The CLI version the project's machines run: a bump moves this line
      # and their install together, or the two validators disagree.
      - name: Validate every spec and change
        env:
          OPENSPEC_TELEMETRY: "0"
        run: npx --yes @fission-ai/openspec@1.12.0 validate --all --strict

  docs-rules:
    name: Docs rules
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check what the validator leaves alone
        run: python3 -I scripts/check-docs.py
