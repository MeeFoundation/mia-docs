# Moves the actions' commit pins in .github/workflows. The OpenSpec CLI the
# validation runs is pinned in the workflow and moved by hand.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    # A release younger than this is not proposed: a compromised tag is
    # usually caught and pulled within days.
    cooldown:
      default-days: 7
    # One pull request a week for all of them, not one per action.
    groups:
      actions:
        patterns: ["*"]
